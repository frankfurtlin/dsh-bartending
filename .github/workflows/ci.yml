name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI 只需要读仓库
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check（node --check）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 本仓没有 npm 依赖，不装依赖直接跑。
      - name: npm run check（lib / client 语法）
        run: npm run check

      # 说明：本仓没有单测（无 test/ 目录，package.json 也没有 test 脚本），因此不跑 npm test。
      # verification/verify.mjs 是需要 Playwright + 真实 DSH 的端到端验收，只在本地手动跑。
